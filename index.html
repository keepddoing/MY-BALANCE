<style>

/* ===== Airbnb 디자인 시스템 ===== */

.hero{background:#fff;border-bottom:1px solid var(--line);padding:24px 0 20px;margin-bottom:24px}

function dropRest(w,di,exId){const n=w.items.length;w.items=w.items.filter(i=>!(i.day==di&&i.type=='rest'&&i.id!=exId));return w.items.length<n}
function wtConflict(w,di,type,exId){return (type=='pt'||type=='weight')?w.items.find(i=>i.day==di&&isWt(i)&&i.id!=exId):null}
const wtMsg=c=>'PT와 개인운동은 하루에 하나만 입력할 수 있어요 (이미 '+tn(c.type)+' 일정이 있어요)';
/* ===== iPhone 위젯(Scriptable)용 데이터 내보내기 ===== */
function wgBuild(){const n=new Date(),lo=new Date(n.getFullYear(),n.getMonth()-1,1),hi=new Date(n.getFullYear(),n.getMonth()+2,0),days={};
 Object.keys(W).forEach(wkk=>{(W[wkk].items||[]).forEach(i=>{if(i.type=='personal')return;const k=addD(wkk,i.day),d=parse(k);if(d<lo||d>hi)return;
  (days[k]||(days[k]=[])).push({t:i.type,n:i.type=='work'||i.type=='rest'?tn(i.type):ckName(i),s:i.time||'',e:i.time?fmt(Math.min(24,st0(i)+durOf(i))):'',p:i.place||'',d:i.status=='done'?1:0})})});
 Object.keys(days).forEach(k=>days[k].sort((x,y)=>(x.s||'99').localeCompare(y.s||'99')));
 return {v:1,saved:new Date().toISOString(),days}}
async function wgExport(){const f=new File([JSON.stringify(wgBuild())],'my-balance-widget.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'MY BALANCE 위젯 데이터'});return}}catch(e){if(e&&e.name=='AbortError')return}
 const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
 toast('파일을 저장했어요. iCloud Drive › Scriptable 폴더로 옮겨 주세요')}
/* ===== 자동 동기화: Google Apps Script 웹 앱 (위젯 데이터 + 기기 간 일정 공유) ===== */
const WGK='mb-sync';let wgT=null,wgBoot=false,wgReady=false,wgPause=false,wgBusy=false,wgLast=0;
const wgRev=()=>parseInt(localStorage.getItem('mb-rev'))||0;
function wgCfg(){try{const o=JSON.parse(localStorage.getItem(WGK));return o&&/^https:\/\/script\.google\.com\/\S+$/.test(o.url)&&o.token&&o.token.length>=8?o:null}catch(e){return null}}
function wgSched(){if(!wgCfg()||!wgReady||wgPause)return;clearTimeout(wgT);wgT=setTimeout(()=>wgPush(false),1500)}
function wgStat(t){const e=document.getElementById('wgst');if(e)e.textContent=t}
async function wgGet(c){const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'mode=full&token='+encodeURIComponent(c.token),{cache:'no-store'});return await r.json()}
async function wgPush(manual,force){const c=wgCfg();if(!c){if(manual===true)toast('먼저 URL과 토큰을 저장해 주세요');return}
 if(!wgReady&&!force){if(manual===true)toast('서버 확인이 끝나면 전송돼요');return}
 try{await fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,force:!!force,data:wgBuild(),full:{rev:wgRev(),S,W}})});
  const n=new Date();wgStat('마지막 전송 '+pad(n.getHours())+':'+pad(n.getMinutes()));if(manual===true)toast('전송했어요')}
 catch(e){wgStat('전송 실패: 인터넷 연결을 확인해 주세요')}}
function wgApply(o){if(!o||!o.data||!o.data.S||!o.data.W)return false;
 S=o.data.S;W=o.data.W;normS();
 try{localStorage.setItem(K,JSON.stringify({S,W}));localStorage.setItem('mb-rev',String(o.rev||0))}catch(e){toast('저장 공간을 확인해 주세요');return false}
 wgBoot=true;try{const t=key(mon(new Date()));if(!wk(t).items.length)generate(t)}finally{wgBoot=false}
 R();toast('다른 기기의 일정으로 업데이트했어요');return true}
async function wgSync(manual){const c=wgCfg();if(!c||wgBusy)return;wgBusy=true;
 try{let o;try{o=await wgGet(c)}catch(e){wgStat('서버에 연결하지 못했어요 (오프라인이거나 URL을 확인해 주세요)');return}
  if(!o||o.ok===false){wgStat('토큰이 맞지 않아요. 토큰을 확인해 주세요');return}
  const srv=o.rev||0,loc=wgRev();
  if(srv>loc){
   if(document.querySelector('dialog[open]:not(#setDlg)'))return;
   if(wgPause&&manual!==true)return;
   if(loc===0&&!confirm('서버에 저장된 일정이 있어요.\n이 기기의 일정을 서버 일정으로 바꿀까요?\n\n확인: 서버 일정 사용 (이 기기 일정은 사라져요)\n취소: 보류 (우측 상단 ⚙ 설정에서 직접 선택)')){wgPause=true;wgStat('동기화 보류 중 — 설정(⚙)의 버튼으로 선택해 주세요');return}
   if(wgApply(o)){wgPause=false;wgReady=true;wgStat('서버 일정으로 업데이트했어요')}return}
  if(wgPause&&manual!==true)return;
  if(srv===0&&loc===0){try{localStorage.setItem('mb-rev',String(Date.now()))}catch(e){}}
  wgReady=true;wgPause=false;
  if(wgRev()>srv||manual===true)await wgPush(manual===true);else wgStat('최신 상태예요')}
 finally{wgBusy=false}}
async function wgForcePull(){const c=wgCfg();if(!c)return toast('먼저 URL과 토큰을 저장해 주세요');
 if(!confirm('서버 일정으로 이 기기의 일정을 바꿀까요?\n(이 기기 일정은 사라져요)'))return;
 try{const o=await wgGet(c);if(!o||o.ok===false||!o.data)return toast('서버에 가져올 일정이 없어요');if(wgApply(o)){wgPause=false;wgReady=true;wgStat('서버 일정으로 바꿨어요')}}catch(e){toast('서버에 연결하지 못했어요')}}
async function wgForcePush(){const c=wgCfg();if(!c)return toast('먼저 URL과 토큰을 저장해 주세요');
 if(!confirm('이 기기의 일정으로 서버 일정을 덮어쓸까요?\n(다른 기기도 다음에 열 때 이 기기 내용으로 바뀌어요)'))return;
 try{localStorage.setItem('mb-rev',String(Date.now()))}catch(e){return toast('저장 공간을 확인해 주세요')}
 wgPause=false;wgReady=true;await wgPush(true,true)}
function wgSaveCfg(){const u=document.getElementById('wgu').value.trim(),t=document.getElementById('wgt').value.trim();
 if(!u&&!t){try{localStorage.removeItem(WGK);localStorage.removeItem('mb-rev')}catch(e){}wgReady=false;wgPause=false;R();toast('자동 동기화를 껐어요');return}
 if(!/^https:\/\/script\.google\.com\/\S+$/.test(u)||t.length<8)return toast('웹 앱 URL과 8자 이상의 토큰을 입력해 주세요');
 try{localStorage.setItem(WGK,JSON.stringify({url:u,token:t}))}catch(e){return toast('저장 공간을 확인해 주세요')}
 wgReady=false;wgPause=false;R();wgSync(true)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-wgLast>5000){wgLast=Date.now();wgSync()}});
function tgDone(id){const i=wk(curK()).items.find(x=>x.id==id);i.status=i.status=='done'?'todo':'done';save();R()}
function editEv(id){openEd(id=='work'?{k:'work'}:wk(curK()).items.find(i=>i.id==id))}
function delIt0(w,it){if(it.type!='rest'&&!it.add){w.del=w.del||[];w.del.push({day:it.od??it.day,type:it.type})}w.items=w.items.filter(i=>i!==it)}
const SUB={weight:[['pt','PT'],['weight','개인운동']],cardio:[['실내 자전거','실내 자전거'],['트레드밀 걷기','트레드밀 걷기'],['가벼운 산책','가벼운 산책']],yoga:[['flying','플라잉 요가'],['yoga','일반 요가']]};
let E=null;
function openEd(src,st){const sd=parse(msel),di=(sd.getDay()+6)%7,w=wk(curK());
 let g='ex',cat='weight',sub='weight',s=st??18,e=Math.min(24,s+1),place=PLC('weight'),memo='',part='전신',stat='todo',all=true,id=null;
 if(src&&src.k=='work'){g='work';const x=wkh(w.cond,di)||[9,18];s=x[0];e=x[1];id='work'}
 else if(src){id=src.id;const t=src.type;place=src.place||'';memo=src.memo||'';part=src.part||'';stat=src.status=='rest'?'todo':src.status;all=!src.time;
  if(src.time){s=st0(src);e=s+durOf(src)}
  if(t=='pt'||t=='weight'){cat='weight';sub=t}else if(t=='cardio'){cat='cardio';sub=part||'유산소'}else if(t=='pilates'){cat='pilates';sub=''}else if(t=='flying'||t=='yoga'){cat='yoga';sub=t}else g=t}
 E={id,di,sub};
 const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
 document.getElementById('dlg').innerHTML=`<h2>일정 수정</h2><div class="f">
 <div id="f_donew" class="chips" style="grid-column:1/-1"><label style="font-size:14px"><input type="checkbox" id="f_done" ${stat=='done'?'checked':''}>완료</label></div>
 <label id="f_catw">운동 종류<select id="f_cat" onchange="fillF()">${[['weight','웨이트'],['cardio','유산소'],['pilates','필라테스'],['yoga','요가']].map(x=>`<option value="${x[0]}" ${x[0]==cat?'selected':''}>${x[1]}</option>`).join('')}</select></label>
 <label id="f_subw">세부 항목<select id="f_sub" onchange="fillF()"></select></label>
 <label id="f_sw">시작<input type="time" id="f_s" value="${tv(s)}" onchange="autoEnd()"></label><label id="f_ew">종료<input type="time" id="f_e" value="${tv(e)}"></label>
 <label id="f_partw">운동 부위<select id="f_part"><option value="">없음</option>${o(PARTS,part)}</select></label>
 <label id="f_memow" style="grid-column:1/-1"><span id="f_memol">메모</span><input type="text" id="f_memo" value="${esc(memo)}"></label>
 <div style="display:none"><input type="hidden" id="f_g" value="${g}"><input type="hidden" id="f_date" value="${msel}"><div id="f_allw"><input type="checkbox" id="f_all" ${all?'checked':''}></div><div id="f_pre"></div><label id="f_clsw"><select id="f_cls" onchange="pickCls()"></select></label><label id="f_placew"><input type="text" id="f_place" value="${esc(place)}"></label></div></div>
 <div class="row" style="margin-top:12px"><button class="pri" onclick="saveEv()">저장</button><button onclick="document.getElementById('dlg').close()">닫기</button>${id?`<button class="ghost" onclick="delEv()">삭제</button>`:''}</div>`;
 document.getElementById('dlg').showModal();fillF()}
function fillF(){const g=f_g.value,ex=g=='ex',c=f_cat.value,sb=c=='cardio'?cdSub():SUB[c],rest=g=='rest',hide=(rest||g=='personal')&&f_all.checked,show=(id,v)=>document.getElementById(id).style.display=v?'':'none';
 const c0=E.sub||f_sub.value;let sbx=sb;if(c=='cardio'&&E.sub&&E.sub!='weight'&&E.sub!='pt'&&!sb.some(x=>x[0]==E.sub))sbx=[...sb,[E.sub,E.sub]];if(sbx)f_sub.innerHTML=sbx.map(x=>`<option value="${x[0]}" ${x[0]==c0?'selected':''}>${x[1]}</option>`).join('');E.sub=null;
 show('f_catw',ex);show('f_subw',ex&&sb);show('f_partw',ex&&c=='weight');show('f_clsw',ex&&c=='yoga');show('f_placew',ex||g=='personal');show('f_memow',g!='work');show('f_donew',ex);show('f_allw',rest);show('f_pre',g=='work');show('f_sw',!hide);show('f_ew',!hide);
 f_memol.textContent=g=='personal'?'제목':ex&&c=='yoga'?'수업명 / 메모':'메모';
 if(ex){const ci=c=='cardio'?Object.values(S.cardio).find(x=>x.name==f_sub.value):null,pl=ci&&ci.place?ci.place:PLC(c=='yoga'?'yoga':c=='weight'?(f_sub.value=='pt'?'pt':'weight'):c);if(!f_place.value||Object.values(S.places).includes(f_place.value)||Object.values(S.cardio).some(x=>x.place==f_place.value)||/^(월평동 헬스장|대전 죽동 STELLA YOGA)$/.test(f_place.value))f_place.value=pl}
 if(ex&&c=='yoga'){const d=parse(f_date.value),di=(d.getDay()+6)%7,fl=f_sub.value=='flying';f_cls.innerHTML='<option value="">직접 입력</option>'+S.yoga.filter(y=>y.day==di&&(y.name.includes('플라잉')==fl)).map(y=>`<option value="${y.id}">${y.time} ${esc(y.name)}</option>`).join('')}}
function pickCls(){const y=S.yoga.find(x=>x.id==f_cls.value);if(y){f_s.value=y.time;f_e.value=tv(tm(y.time)+70/60);f_memo.value=y.name;f_place.value=PLC('yoga')}}
function autoEnd(){if(f_g.value=='ex'&&f_cat.value=='weight'&&f_s.value)f_e.value=tv(Math.min(24,tm(f_s.value)+1))}
function wPre(t){f_s.value=t=='A'?'07:00':'08:00';f_e.value=t=='A'?'16:00':'17:00'}
function saveEv(){const id=E.id,g=f_g.value,nd=parse(f_date.value);if(isNaN(nd))return toast('날짜를 확인해 주세요');
 const nk=key(mon(nd)),ni=(nd.getDay()+6)%7,ok=curK(),ow=wk(ok),all=(g=='rest'||g=='personal')&&f_all.checked;let s=tm(f_s.value),e=tm(f_e.value);if(e===0)e=24;
 if(!all&&!(e>s))return toast('종료 시간이 시작보다 늦어야 해요');
 if(id=='work'){matWk(ow.cond);if(g!='work'||ok!=nk||E.di!=ni)delete ow.cond.wk[E.di]}
 const cat=f_cat.value,sub=f_sub.value,old=id&&id!='work'?ow.items.find(i=>i.id==id):null;
 if(g=='work'){if(old)delIt0(ow,old);const nc=wk(nk).cond;matWk(nc);nc.wk[ni]=[Math.round(s*100)/100,Math.round(e*100)/100]}
 else{const type=g=='ex'?(cat=='weight'||cat=='yoga'?sub:cat):g,nw=wk(nk);
  if(g=='ex'){const c=wtConflict(nw,ni,type,id);if(c)return toast(wtMsg(c))}else if(g=='rest'&&nw.items.some(i=>i.day==ni&&isEx(i)&&i.id!=id))return toast(RESTMSG);
  RD=g=='ex'&&dropRest(nw,ni,id);
  const v={day:ni,time:all?'':tv(s),dur:all?'':Math.round((e-s)*100)/100,type,part:'',place:'',min:'',memo:f_memo.value.trim()};
  if(g=='ex'){v.place=f_place.value;if(cat=='weight')v.part=f_part.value;else if(cat=='cardio'){v.part=sub;v.min=Math.round((e-s)*60)}else if(cat=='pilates')v.part='코어'}else if(g=='personal')v.place=f_place.value;
  const status=g=='rest'?'rest':g=='personal'?'todo':(f_done.checked?'done':(old&&old.status=='chg'?'chg':'todo'));
  if(old&&ok==nk){if(old.day!=ni&&old.od==null)old.od=old.day;Object.assign(old,v,{u:1,status})}
  else{if(old)delIt0(ow,old);wk(nk).items.push(old?{...old,...v,u:1,status}:{id:uid(),u:1,add:1,status,...v})}}
 msel=f_date.value;mc=new Date(nd.getFullYear(),nd.getMonth(),1);cur=nk;save();document.getElementById('dlg').close();R();toast((RD?'휴식 삭제 · ':'')+'저장했어요')}
function delEv(){const id=E.id,w=wk(curK());if(id=='work'){matWk(w.cond);delete w.cond.wk[E.di]}else delIt0(w,w.items.find(i=>i.id==id));save();document.getElementById('dlg').close();R();toast('삭제했어요')}
function yAdd(id){const y=S.yoga.find(x=>x.id==id),t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+(y.day-((t.getDay()+6)%7)+7)%7);
 dropRest(wk(key(mon(t))),y.day);wk(key(mon(t))).items.push({id:uid(),u:1,add:1,status:'todo',day:y.day,time:y.time,dur:1.17,type:y.name.includes('플라잉')?'flying':'yoga',part:'',place:PLC('yoga'),min:'',memo:y.name});
 save();tab='month';msel=key(t);cur=key(mon(t));mc=new Date(t.getFullYear(),t.getMonth(),1);R();openDay();toast(`${t.getMonth()+1}월 ${t.getDate()}일 타임테이블에 추가했어요`)}
wgBoot=true;load();cur=key(mon(new Date()));if(!wk(cur).items.length)generate(cur);R();wgBoot=false;wgSync();
</script></body></html>
