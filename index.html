  if(!(per&&x.all))h+=`<div class="xt"><div class="xbar" id="xbar">${[0,1].map(r=>`<div class="xr2">${[0,1,2,3,4,5,6,7,8].map(i=>`<b>${6+r*9+i}</b>`).join('')}${xOthers().map(a=>`<i class="xo" style="${xseg(a[0],a[1],r)}"></i>`).join('')}<i class="xg" id="xg${r}"></i></div>`).join('')}</div><p class="mut" style="margin:0 0 8px">막대를 끌어 시간을 정하고, 버튼으로 30분씩 조정하세요. 회색은 기존 일정이에요.</p><div class="xtm"><div><small>시작</small><input type="time" step="1800" id="xs" onchange="xIn('s',this.value)"><div class="row"><button class="sm" onclick="xAdj('s',-.5)">−30분</button><button class="sm" onclick="xAdj('s',.5)">+30분</button></div></div><div><small>종료</small><input type="time" step="1800" id="xe" onchange="xIn('e',this.value)"><div class="row"><button class="sm" onclick="xAdj('e',-.5)">−30분</button><button class="sm" onclick="xAdj('e',.5)">+30분</button></div></div></div><div class="pk xdu">${[['30분',.5],['1시간',1],['1.5시간',1.5],['2시간',2]].map(z=>`<button onclick="xDur(${z[1]})">${z[0]}</button>`).join('')}</div><p id="xsum"></p><p id="xov" class="xw"></p></div>`;
  if(ex)h+=`<details class="xd"><summary>메모</summary><input class="xin" placeholder="${x.cat=='yoga'?'수업명':'메모'}" value="${esc(x.memo)}" oninput="X.memo=this.value"></details>`}
 if(ex&&rdy)h+=`<label class="xa"><input type="checkbox" ${x.pin?'checked':''} onchange="X.pin=this.checked?1:0">📌 일정 고정 (자동 재생성에서 제외)</label>`;
 if(x.id){if(ex)h+=`<p class="xa"><button class="sm ghost" onclick="Q('sh').close();toRest('${x.id}')">😴 휴식으로 바꾸기</button></p>`;h+=`<p class="xl">복사 · 날짜 이동</p><div class="pk"><button onclick="xCopy('${x.id}',addD(X.k,1))">내일로 복사</button><button onclick="xCopy('${x.id}',addD(X.k,7))">다음 주 같은 요일 복사</button></div><div class="xcm"><input type="date" id="xd" value="${addD(x.k,1)}"><button onclick="xCopy('${x.id}',Q('xd').value)">복사</button><button onclick="xMove('${x.id}',Q('xd').value)">이동</button></div>`}
 return h}

 const c=e=>{const r=g.getBoundingClientRect();return (e.clientY-r.top<r.height/2?0:18)+Math.max(0,Math.min(17,Math.floor((e.clientX-r.left)/r.width*18)))};

function xUp(){const s=Q('xs');if(!s)return;s.value=tv(X.s);Q('xe').value=tv(X.e);Q('xsum').textContent=`${fmt(X.s)} – ${tv(X.e)} · ${Math.round((X.e-X.s)*60)}분`;
 [0,1].forEach(r=>{const e=Q('xg'+r);if(e)e.style.cssText=xseg((X.s-6)*2,(X.e-6)*2,r)});
 const o=xOv(X.s,X.e,X.id);Q('xov').innerHTML=o.length?'⚠ '+o.map(r=>esc(r.n)+' '+esc(r.tm)).join(', ')+' 일정과 시간이 겹쳐요':''}

 else{const old=x.id&&x.id!='work'?w.items.find(i=>i.id==x.id):null,type=ex?(x.cat=='weight'||x.cat=='yoga'?x.sub:x.cat):x.kind;
